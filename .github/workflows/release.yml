name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  release:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build React and Electron
        run: npm run build

      - name: Patch noble/hashes for electron-builder (Fix ESM bug)
        run: |
          $paths = @("node_modules/app-builder-lib/node_modules/@noble/hashes/package.json", "node_modules/@noble/hashes/package.json")
          foreach ($file in $paths) {
            if (Test-Path $file) {
              $json = Get-Content $file -Raw | ConvertFrom-Json
              if ($json.exports) {
                $json.PSObject.Properties.Remove('exports')
                $json | ConvertTo-Json -Depth 100 | Set-Content $file
              }
            }
          }
        shell: pwsh

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
